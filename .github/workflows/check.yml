name: check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code 2.1.293
        run: npm install -g @anthropic-ai/claude-code@2.1.293 && claude --version
      - name: Validate the plugin and its marketplace
        run: claude plugin validate .claude-plugin/plugin.json && claude plugin validate .claude-plugin/marketplace.json
      - name: Plugin tests on this OS
        run: claude plugin test .
